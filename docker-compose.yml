version: '3.8'

services:
  # PHP Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: support_system_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - support_network
    depends_on:
      - mysql
      - redis
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=mysql
      - DB_DATABASE=support_system
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - BROADCAST_CONNECTION=reverb

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: support_system_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - support_network
    depends_on:
      - app

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: support_system_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: support_system
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: support_user
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - support_network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # Redis
  redis:
    image: redis:alpine
    container_name: support_system_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - support_network

  # Node.js for Vite
  node:
    image: node:20-alpine
    container_name: support_system_node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    networks:
      - support_network

  # Laravel Reverb WebSocket
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: support_system_reverb
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    networks:
      - support_network
    depends_on:
      - app
      - redis

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: support_system_queue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: php artisan queue:work --tries=3
    networks:
      - support_network
    depends_on:
      - app
      - redis

networks:
  support_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
